<form [formGroup]="formLogin" (ngSubmit)="onSubmit()">
    <div>
        <label for="email">Email:</label>
        <input formControlName="email" type="email" id="email" name="email" autocomplete="email">
    </div>
    <div>
        <label for="password">Contraseña:</label>
        <input formControlName="password" type="password" id="password" name="password" autocomplete="current-password">
    </div>
    <button type="submit" [disabled]="formLogin.invalid">Entrar</button>
</form>
