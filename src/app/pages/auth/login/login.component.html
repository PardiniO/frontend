<section class="auth-container">
    <div class="auth-card">
        <h2>Iniciar sesión</h2>

        <i class="fas fa-user-circle auth-icon"></i>

        <form [formGroup]="form" (ngSubmit)="onSubmit()">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" formControlName="password" id="email" placeholder="ejemplo@mail.com"/>
                <p class="validation-error" *ngIf="form.get('email')?.invalid && form.get('email')?.touched">
                    Email requerido.
                </p>
            </div>

            <div>
                <label for="password">Contraseña</label>
                <input type="password" formControlName="password" id="password" placeholder="********">
                <p class="validation-error" *ngIf="form.get('password')?.invalid && form.get('password')?.touched">
                    Contraseña requerida.
                </p>
            </div>

            <button class="btn-primary" type="submit" [disabled]="form.invalid || isLoading">
                {{ isLoading ? 'Cargando...' : 'Entrar' }}
            </button>
        </form>

        <p class="redirect">
            ¿No tenés cuenta?
            <a routerLink="/register">Registrate</a>
        </p>
        <p class="error-message" *ngIf="errorMessage">{{ errorMessage }}</p>
    </div>
</section>
