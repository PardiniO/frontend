<form [formGroup]="formRegister" (ngSubmit)="onSubmit()">
    <div>
        <label for="username">Nombre de usuario:</label>
        <input formControlName="username" type="text" id="username" name="username" autocomplete="username">
    </div>
    <div>
        <label for="email">Email:</label>
        <input formControlName="email" id="email" type="email" name="email" autocomplete="email">
    </div>
    <div>
        <label for="password">Contraseña:</label>
        <input formControlName="password" type="password" id="password" name="password" autocomplete="new-password">
    </div>
    <div>
        <label for="passwordConfirm">Confirmar contraseña:</label>
        <input formControlName="passwordConfirm" type="password" id="passwordConfirm" name="passwordConfirm" autocomplete="new-password">
    </div>
    <button type="submit" >crear cuenta</button>
</form>
