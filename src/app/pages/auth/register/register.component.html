<section class="auth-container">
    <div class="auth-card">
        <h2>Crear cuenta</h2>
        <form [formGroup]="form" (ngSubmit)="onSubmit">
            <label for="username">Nombre de usuario</label>
            <input type="text" formName="username" id="username" placeholder="Nombre de usuario">

            <label for="email">Email</label>
            <input type="email" formControlName="password" id="email" placeholder="ejemplo@mail.com"/>

            <label for="password">Contraseña</label>
            <input type="password" formControlName="password" id="password" placeholder="********">

            <label for="passwordConfirm">Confirmar contraseña</label>
            <input type="passwordConfirm" formControlName="passwordConfirm" id="passwordConfirm" placeholder="********">

            <button type="submit" [disabled]="form.invalid">Entrar</button>
        </form>
        <p class="redirect">
            ¿Ya tenés cuenta?
            <a routerLink="/login">Iniciá sesión</a>
        </p>
        <p class="error" *ngIf="error">{{ error }}</p>
    </div>
</section>
