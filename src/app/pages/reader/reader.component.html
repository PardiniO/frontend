<div class="reader-container">
    <div class="reader-toolbar">
        <button (click)="toggleNotes()">Notas</button>
        <button (click)="toggleHighlights()">Resaltador</button>
    </div>

    <div class="reader-content">
        <ng-extended-pdf-viewer 
            [src]="currentBook.fileUrl"
            [page]="currentPage"
            [minifiedJSLibraries]="false"
            [use-sidebar]="false"
            [showBorders]="false"
            [height]="'100%'"
            [showToolbar]="true"
            [showFindButton]="true"
            (pagesLoaded)="onPdfLoaded($event)"
            (pageChange)="onPageChange($event)"
        ></ng-extended-pdf-viewer>
        <ng-container *ngIf="currentBook?.format === 'epub'">
            <div id="epub-container"></div>
        </ng-container>
    </div>

    <app-notes-panel
        *ngIf="showNotes"
        [bookId]="currentBook.id"
        [currentPage]="currentPage"
    ></app-notes-panel>

    <app-highlight-toolbar
        *ngIf="showHighlights"
        (highligh)="onHighligh($event)"
    ></app-highlight-toolbar>
</div>
