<div class="dropzone"
    (dragover)="onDragOver($event)"
    (dragleave)="onDragLeave($event)"
    (drop)="onDrop($event)">

    <p *ngIf="!file">Arrastrá un archivo PDF/EPUB acá</p>

    <input type="file"
        #fileInput
        (change)="onFileSelected($event)"
        accept=".pdf, .epub"
        hidden />

    <p>O hacé click y seleccionalo</p>
    <button
        type="button"
        (click)="fileInput.click()">Seleccionar archivo</button>
</div>
